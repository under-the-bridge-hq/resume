name: Release PDF

on:
  push:
    branches:
      - main
    paths:
      - docs/README.md
  workflow_dispatch:

jobs:
  release:
    name: tag and release pdf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine version and create tag
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)
          NEXT_PATCH=$(echo "$LATEST_TAG" | awk -F. '{print $1"."$2"."$3+1}')
          DATE=$(TZ=Asia/Tokyo date '+%Y%m%d')
          echo "tag=${NEXT_PATCH}" >> "$GITHUB_OUTPUT"
          echo "name=${NEXT_PATCH}_${DATE}" >> "$GITHUB_OUTPUT"
          git tag "$NEXT_PATCH"
          git push origin "$NEXT_PATCH"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "" --destination ../_site
        working-directory: docs
      - name: Copy _site to docs/_site
        run: cp -r _site docs/_site
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chrome for Puppeteer
        run: |
          set -x
          # npx ではなく node_modules のローカル puppeteer CLI を直接実行する
          # （npx 経由だと CI 上で何も DL せず無言終了することがあるため）
          node node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js browsers install chrome
          # Chrome が実際に配置されたか検証し、無ければ即 fail させる
          # （install が無言で何もしなくても後続まで通過させない）
          CHROME_BIN=$(find "$PUPPETEER_CACHE_DIR/chrome" -name chrome -type f | head -1)
          echo "Resolved Chrome: ${CHROME_BIN:-<none>}"
          test -n "$CHROME_BIN" && test -f "$CHROME_BIN"
      - name: Generate PDF from Jekyll HTML
        run: npm run build:pdf
      - name: Rename PDF
        run: mv docs/README.pdf "docs/resume_${{ steps.version.outputs.name }}.pdf"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: "Resume updated on ${{ steps.version.outputs.name }}"
          fail_on_unmatched_files: true
          files: docs/resume_${{ steps.version.outputs.name }}.pdf
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.name }}
